<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Intelligence Pin</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0d0d0e;
        color: #e0d8d0;
        overflow-x: hidden;
        /* Side panel is resizable; fill whatever width Chrome gives us. */
        min-height: 100vh;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
        font-size: 13px;
      }
      #root {
        min-height: 100vh;
      }
      /* Slim scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: #252528; border-radius: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
